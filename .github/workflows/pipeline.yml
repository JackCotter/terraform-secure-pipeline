name: Secure Infra Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: "1.16.0"

jobs:
  plan:
    name: Terrafrom Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a #v4
        with:
          role-to-assume: arn:aws:iam::985753407778:role/github-actions-terraform-readonly
          aws-region: ca-west-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd #v3
        with:
          terraform_version: ${{env.TF_VERSION}}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan

  checkov:
    name: Checkov Configuration Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@8c07e78c64ddc2209d8c193a4e321aad67677f8d #v12
        with:
          directory: .
          quiet: true
          soft_fail: false

  sast-scan:
    name: Bandit SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 #v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit SAST scan
        run: bandit -r leaderboard_game/game leaderboard_game/leaderboard_game -ll

  dependency-scan:
    name: Python Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 #v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r leaderboard_game/requirements.txt

  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4

      - name: Write self-signed cert for CI
        run: |
          echo "$NGINX_SSL_CERT" | base64 -d > leaderboard_game/nginx/nginx-selfsigned.crt
          echo "$NGINX_SSL_KEY" | base64 -d > leaderboard_game/nginx/nginx-selfsigned.key
        env:
          NGINX_SSL_CERT: ${{ secrets.NGINX_SSL_CERT }}
          NGINX_SSL_KEY: ${{ secrets.NGINX_SSL_KEY }}

      - name: Build all images via compose
        run: docker compose -f leaderboard_game/docker-compose.yml build

      - name: Get built image list
        id: images
        run: |
          IMAGES=$(docker compose -f leaderboard_game/docker-compose.yml config --images)
          echo "images<<EOF" >> $GITHUB_OUTPUT
          echo "$IMAGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241

      - name: Scan each image
        env:
          IMAGES: ${{ steps.images.outputs.images }}
        run: |
          echo "$IMAGES" | while IFS= read -r img; do
            [ -z "$img" ] && continue
            echo "Scanning $img"
            trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed "$img"
          done

  apply:
    name: Terraform Apply
    needs: [plan, checkov, sast-scan, dependency-scan]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    env:
      AWS_REGION: ca-west-1
      AWS_ACCOUNT_ID: "985753407778"
      ECR_REGISTRY: 985753407778.dkr.ecr.ca-west-1.amazonaws.com
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4
 
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a #v4
        with:
          role-to-assume: arn:aws:iam::985753407778:role/github-actions-terraform
          aws-region: ca-west-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd #v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
 
      - name: Terraform Init
        run: terraform init
 
      - name: Terraform Plan
        run: terraform plan -out=tfplan
 
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
 
      - name: Build web image
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/leaderboard-web:${{ env.IMAGE_TAG }} \
            -f leaderboard_game/Dockerfile \
            leaderboard_game
 
      - name: Write self-signed cert for CI
        env:
          NGINX_SSL_CERT: ${{ secrets.NGINX_SSL_CERT }}
          NGINX_SSL_KEY: ${{ secrets.NGINX_SSL_KEY }}
        run: |
          echo "$NGINX_SSL_CERT" | base64 -d > leaderboard_game/nginx/nginx-selfsigned.crt
          echo "$NGINX_SSL_KEY" | base64 -d > leaderboard_game/nginx/nginx-selfsigned.key

      - name: Build nginx image
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/leaderboard-nginx:${{ env.IMAGE_TAG }} \
            -f leaderboard_game/nginx/Dockerfile \
            leaderboard_game/nginx
 
      - name: Push images to ECR
        run: |
          docker push ${{ env.ECR_REGISTRY }}/leaderboard-web:${{ env.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/leaderboard-nginx:${{ env.IMAGE_TAG }}
 


