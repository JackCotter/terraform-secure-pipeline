name: Secure Infra Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TF_VERSION: "1.16.0"

jobs:
  plan:
    name: Terrafrom Plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a #v4
        with:
          role-to-assume: arn:aws:iam::985753407778:role/github-actions-terraform-readonly
          aws-region: ca-west-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd #v3
        with:
          terraform_version: ${{env.TF_VERSION}}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan

  checkov:
    name: Checkov Configuration Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@8c07e78c64ddc2209d8c193a4e321aad67677f8d #v12
        with:
          directory: .
          quiet: true
          soft_fail: false

  sast-scan:
    name: Bandit SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 #v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit SAST scan
        run: bandit -r leaderboard_game/game leaderboard_game/leaderboard_game -ll

  dependency-scan:
    name: Python Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 #v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r leaderboard_game/requirements.txt

  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4

      - name: Build web image
        run: |
          docker build \
            -t leaderboard-web \
            -f leaderboard_game/Dockerfile \
            leaderboard_game
 
      - name: Build nginx image
        run: |
          docker build \
            -t leaderboard-nginx \
            -f leaderboard_game/nginx/Dockerfile \
            leaderboard_game/nginx

      - name: Build db image
        run: |
          docker build \
            -t leaderboard-db \
            -f leaderboard_game/docker/db/Dockerfile \
            leaderboard_game/docker/db

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@e07451d2e059ed86c2870430ea286b3a9e0bf241

      - name: Scan web image
        run: trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed "leaderboard-web"

      - name: Scan nginx image
        run: trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed "leaderboard-nginx"

      - name: Scan db image
        run: trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed "leaderboard-db"


  apply:
    name: Terraform Apply
    needs: [plan, checkov, sast-scan, dependency-scan]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    env:
      AWS_REGION: ca-west-1
      AWS_ACCOUNT_ID: "985753407778"
      ECR_REGISTRY: 985753407778.dkr.ecr.ca-west-1.amazonaws.com
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 #v4
 
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a #v4
        with:
          role-to-assume: arn:aws:iam::985753407778:role/github-actions-terraform
          aws-region: ca-west-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd #v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
 
      - name: Terraform Init
        run: terraform init
 
      - name: Terraform Plan
        run: terraform plan -out=tfplan
 
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
 
      - name: Build web image
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/leaderboard-web:${{ env.IMAGE_TAG }} \
            -f leaderboard_game/Dockerfile \
            leaderboard_game
 
      - name: Build nginx image
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/leaderboard-nginx:${{ env.IMAGE_TAG }} \
            -f leaderboard_game/nginx/Dockerfile \
            leaderboard_game/nginx

      - name: Build db image
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/leaderboard-db:${{ env.IMAGE_TAG }} \
            -f leaderboard_game/docker/db/Dockerfile \
            leaderboard_game/docker/db
 
      - name: Push images to ECR
        run: |
          docker push ${{ env.ECR_REGISTRY }}/leaderboard-web:${{ env.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/leaderboard-nginx:${{ env.IMAGE_TAG }}
          docker push ${{ env.ECR_REGISTRY }}/leaderboard-db:${{ env.IMAGE_TAG }}

      - name: Upload deploy script and compose file to S3
        run: |
          aws s3 cp deploy.sh s3://leaderboard-releases/releases/${{ env.IMAGE_TAG }}/deploy.sh
          aws s3 cp leaderboard_game/docker-compose.yml s3://leaderboard-releases/releases/${{ env.IMAGE_TAG }}/docker-compose.yml

      - name: Deploy via SSM Run Command
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=terraform-pipeline" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)

          if [ "$INSTANCE_ID" == "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "ERROR: No running instance found matching the tag filter."
            exit 1
          fi

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=terraform-pipeline" \
            --parameters "commands=[\"aws s3 cp s3://leaderboard-releases/releases/${{ env.IMAGE_TAG }}/deploy.sh /tmp/deploy.sh\",\"chmod +x /tmp/deploy.sh\",\"/tmp/deploy.sh ${{ env.IMAGE_TAG }}\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status, StdOut:StandardOutputContent, StdErr:StandardErrorContent}" \
            --output json

