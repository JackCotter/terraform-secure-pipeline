services:
  
  nginx: 
    image: 985753407778.dkr.ecr.ca-west-1.amazonaws.com/leaderboard-nginx:${IMAGE_TAG}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - /opt/leaderboard/ssl:/etc/nginx/ssl:ro

  db:
    image: 985753407778.dkr.ecr.ca-west-1.amazonaws.com/leaderboard-db:${IMAGE_TAG}
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not exposed to the host at all — only reachable by the web service, on the compose network.

  web:
    image: 985753407778.dkr.ecr.ca-west-1.amazonaws.com/leaderboard-web:${IMAGE_TAG}
    restart: always
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      - db
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 leaderboard_game.wsgi:application"

volumes:
  pgdata:
  static_volume:
  media_volume:
