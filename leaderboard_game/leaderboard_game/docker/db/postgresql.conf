# Overrides applied on top of the image's default postgresql.conf.

# Force strong password hashing for any newly created roles/passwords.
password_encryption = scram-sha-256

# Reasonable cap for a small single-app instance — prevents connection
# exhaustion from a runaway client or bug from taking the DB down entirely.
max_connections = 50

# Log anything that takes more than 1s — cheap early warning for a stuck
# query or an injection attempt doing something expensive.
log_min_duration_statement = 1000
log_connections = on
log_disconnections = on

# Don't log full statement text by default (could log sensitive data);
# duration-based logging above is enough for spotting problems.
log_statement = 'none'
