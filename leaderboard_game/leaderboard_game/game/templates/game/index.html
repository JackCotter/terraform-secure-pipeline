{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reflex — click the leaderboard</title>
  <link rel="stylesheet" href="{% static 'game/style.css' %}">
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1>Reflex</h1>
      <p class="sub">Click the instant it turns green. Slowest wins nothing.</p>
    </header>

    <section class="game-panel">
      <button id="pad" class="pad" data-state="idle">Click to start</button>
      <p id="readout" class="readout"></p>
    </section>

    <section id="submit-panel" class="submit-panel" hidden>
      <form id="score-form">
        {% csrf_token %}
        <input
          type="text"
          id="name"
          name="name"
          maxlength="20"
          placeholder="Display name"
          autocomplete="off"
          required
        >
        <input type="hidden" id="time_ms" name="time_ms">
        <button type="submit">Save score</button>
      </form>
      <p id="submit-msg" class="submit-msg"></p>
    </section>

    <section class="board">
      <h2>Fastest</h2>
      <ol id="leaderboard-list">
        {% for score in top_scores %}
          <li><span class="lb-name">{{ score.name }}</span><span class="lb-time">{{ score.time_ms }}ms</span></li>
        {% empty %}
          <li class="lb-empty">No scores yet — be the first.</li>
        {% endfor %}
      </ol>
    </section>
  </main>

  <script src="{% static 'game/script.js' %}"></script>
</body>
</html>
