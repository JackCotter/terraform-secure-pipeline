upstream django {
    server web:8000;
}

server {
    listen 8080;
    server_name _;

    client_max_body_size 10M;

    # --- Security headers ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Tighten this once you know exactly what your app loads (scripts, fonts, etc.)
    add_header Content-Security-Policy "default-src 'self'" always;

    # Hide nginx version in error pages / headers
    server_tokens off;

    # --- Static files served directly by nginx, not proxied to Django ---
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # --- Everything else proxied to gunicorn ---
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Block access to hidden files (.env, .git, etc.) if they somehow land in the served root
    location ~ /\. {
        deny all;
    }
}
