upstream django {
    server web:8000;
}

limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_status 429;

server {
    listen 443 ssl;
    # Using self-singned cert for testing and dev, replace with CA Cert when domain is used.
    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name _;

    client_max_body_size 10M;

    # --- Security headers ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Tighten this once you know exactly what your app loads (scripts, fonts, etc.)
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # Hide nginx version in error pages / headers
    server_tokens off;

    # --- Static files served directly by nginx, not proxied to Django ---
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    # --- Everything else proxied to gunicorn ---
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        limit_req zone=general burst=20 nodelay;
    }

    # Block access to hidden files (.env, .git, etc.) if they somehow land in the served root
    location ~ /\. {
        deny all;
    }
}

server {
    listen 80;

    # Hide nginx version in error pages / headers
    server_tokens off;
    return 301 https://$host$request_uri;  # redirect HTTP to HTTPS
}
